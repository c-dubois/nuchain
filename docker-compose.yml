services:
  postgres:
    image: postgres:15-alpine
    container_name: nuchain-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuchain_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuchain_password}
      POSTGRES_DB: ${POSTGRES_DB:-nuchain_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nuchain_user} -d ${POSTGRES_DB:-nuchain_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./nuchain-backend
      dockerfile: Dockerfile
    container_name: nuchain-backend
    env_file:
      - .env.docker
    volumes:
      - ./nuchain-backend:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./nuchain-frontend
      dockerfile: Dockerfile
    container_name: nuchain-frontend
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_APP_NAME=NuChain
      - VITE_CLOUD_NAME=c-dubois
    volumes:
      - ./nuchain-frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: